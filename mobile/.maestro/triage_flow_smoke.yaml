# Smoke: Intro -> 2-checkbox consent -> semptom girişi -> gönder -> QUESTION veya RESULT
# Backend erişilebilir olmalı (EXPO_PUBLIC_API_BASE). Consent endpoint
# (POST /v1/consent) da hayatta olmalı — başlangıçta iki rıza kaydı yazıyor.
# Run: maestro test .maestro/triage_flow_smoke.yaml
appId: com.triaige.app
---
- launchApp
- extendedWaitUntil:
    visible:
      text: "Başla"
    timeout: 15000
# Intro'da "Başla" görünür ama üç onay kutusu işaretlenmedikçe disabled.
# TR canonical label'lara tıklıyoruz (mobile/i18n/tr.json:intro.consent*Label).
# Üçüncü kutu — yaş gate (DPIA R-7) — session 25'te eklendi.
- tapOn:
    text: "Kullanım koşullarını okudum ve kabul ediyorum"
- tapOn:
    text: "Sağlık verilerimin işlenmesine açık rıza veriyorum"
- tapOn:
    text: "13 yaşında veya daha büyüğüm"
- tapOn:
    text: "Başla"
- extendedWaitUntil:
    visible:
      text: "Gönder"
    timeout: 10000
- tapOn:
    text: "Belirtini yaz…"
- inputText: "baş ağrısı"
- tapOn:
    text: "Gönder"
# QUESTION ekranında "Evet" görünene kadar bekle, tıkla (tek soru varsayımı; 2+ soruda timeout olabilir)
- extendedWaitUntil:
    visible:
      text: "Evet"
    timeout: 30000
- tapOn:
    text: "Evet"
# Sonuç ekranı: "Yeni Değerlendirme Başlat" butonu görünene kadar bekle
- extendedWaitUntil:
    visible:
      text: "Yeni Değerlendirme Başlat"
    timeout: 45000
- assertVisible: "Yeni Değerlendirme Başlat"
