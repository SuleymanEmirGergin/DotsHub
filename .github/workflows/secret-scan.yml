# Secret scanning: detect accidentally committed secrets (API keys, tokens, etc.)
name: Secret Scan

on:
  pull_request:
    paths:
      - "**"
  push:
    branches:
      - main
    paths:
      - "**"
  workflow_dispatch: {}

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
