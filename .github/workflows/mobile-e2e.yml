# Mobile E2E (Maestro) – opsiyonel; cihaz/emülatör veya Maestro Cloud olmadan adım atlanır veya fail eder (continue-on-error).
name: Mobile E2E (Maestro)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch: {}

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  maestro-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Cihaz/emülatör yoksa veya Maestro Cloud kullanılmıyorsa fail kabul edilir; CI bloklamaz.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Maestro dependency)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          # Maestro 2.x prints a multi-line banner on --version; piping
          # that straight into $GITHUB_ENV fails with "Invalid format"
          # because the file-command parser rejects multi-line values
          # without a delimiter. Normalize to a single line + empty
          # fallback so the env assignment stays valid regardless of
          # what upstream Maestro decides to print next.
          VER="$("$HOME/.maestro/bin/maestro" --version 2>/dev/null | head -n1 | tr -d '\r' || true)"
          echo "MAESTRO_VERSION=${VER:-unknown}" >> $GITHUB_ENV

      - name: "Run Maestro smoke (no device: will skip/fail; use Maestro Cloud or local for real E2E)"
        run: |
          "$HOME/.maestro/bin/maestro" test mobile/.maestro/triage_flow_smoke.yaml || true
        continue-on-error: true

      - name: Summary
        run: |
          echo "Maestro E2E job tamamlandı. Gerçek cihaz/emülatör veya Maestro Cloud olmadan test adımları atlanmış veya fail etmiş olabilir."
          echo "Yerel çalıştırma: cd mobile && npx expo run:ios (veya run:android), sonra maestro test .maestro/triage_flow_smoke.yaml"
