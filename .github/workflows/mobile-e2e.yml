# Mobile E2E (Maestro) – opsiyonel; cihaz/emülatör veya Maestro Cloud olmadan adım atlanır veya fail eder (continue-on-error).
name: Mobile E2E (Maestro)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch: {}

jobs:
  maestro-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # Cihaz/emülatör yoksa veya Maestro Cloud kullanılmıyorsa fail kabul edilir; CI bloklamaz.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Maestro dependency)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          echo "MAESTRO_VERSION=$($HOME/.maestro/bin/maestro --version 2>/dev/null || true)" >> $GITHUB_ENV

      - name: "Run Maestro smoke (no device: will skip/fail; use Maestro Cloud or local for real E2E)"
        run: |
          "$HOME/.maestro/bin/maestro" test mobile/.maestro/triage_flow_smoke.yaml
        id: maestro

      - name: Summary
        if: always()
        run: |
          echo "Maestro E2E job finished. Without a real device/emulator or Maestro Cloud, steps may have been skipped or failed."
          echo "Maestro version: ${MAESTRO_VERSION:-unknown}"
          echo "Local run: cd mobile && npx expo run:ios (or run:android), then maestro test .maestro/triage_flow_smoke.yaml"
