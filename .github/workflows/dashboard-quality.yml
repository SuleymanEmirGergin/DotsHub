name: Dashboard Quality

on:
  # NOTE: GitHub Actions rejects a workflow file that declares both
  # `paths` and `paths-ignore` at the same trigger level (run fails
  # with "workflow file issue" in 0s, no logs). We collapse both into
  # `paths` with a negative glob for markdown — same semantics, valid
  # schema.
  pull_request:
    paths:
      - "dashboard/**"
      - "!dashboard/**/*.md"
      - ".github/workflows/dashboard-quality.yml"
  push:
    branches:
      - main
    paths:
      - "dashboard/**"
      - "!dashboard/**/*.md"
      - ".github/workflows/dashboard-quality.yml"
  workflow_dispatch: {}

concurrency:
  group: dashboard-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dashboard-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dashboard typecheck
        run: pnpm run lint

      - name: Run dashboard proxy route contract checks
        run: pnpm run test:routes

      - name: Run dashboard eslint
        env:
          npm_config_offline: "false"
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: pnpm run lint:eslint
