# Dashboard: contract checks + E2E (Node, Playwright)
name: Dashboard tests

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  workflow_dispatch:
    inputs:
      include_staging:
        description: "Run the live-staging e2e suite against the staging Supabase"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  # Nightly staging regression — runs the full live-staging e2e suite
  # against the deployed Vercel preview + staging Supabase, so Supabase
  # / Vercel / deploy drift is caught without waiting for the next PR.
  # Runs only e2e-staging (localhost smoke is gated on push/PR paths).
  schedule:
    - cron: "0 6 * * *"

defaults:
  run:
    working-directory: dashboard

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    # localhost smoke — push + PR + manual dispatch. Skip on schedule
    # so the nightly cron runs only `e2e-staging`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm run test:routes && pnpm run test:i18n-contract

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        # Dummy Supabase env is set so:
        #   1. `supabaseAdmin()` / `createServerClient()` don't throw at
        #      module load (they need non-empty URL + key to construct).
        #   2. `requireAdmin()` takes the real auth path (ANON_KEY set,
        #      so the dev-bypass is skipped), hits the stub URL, fails
        #      to fetch a user, and redirects to /login — which the
        #      smoke test accepts.
        # Real staging secrets are NOT used here; those only feed the
        # `e2e-staging` job.
        run: pnpm run dev &
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-smoke
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-for-ci-smoke
          NEXT_PUBLIC_API_BASE: http://127.0.0.1:8000
          ADMIN_API_KEY: dummy

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 2; done

      - name: Run localhost E2E tests
        run: pnpm exec playwright test --project=localhost
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        timeout-minutes: 5

  e2e-staging:
    # Live-staging run triggered by either:
    #   - workflow_dispatch with include_staging=true (manual on-demand)
    #   - scheduled cron (nightly regression against staging)
    # Never runs on push/PR automatically so regular commits don't
    # pollute staging Supabase.
    #
    # Intentionally independent of `test` — staging exercises real
    # Supabase auth + data against a deployed URL and must not be held
    # hostage to pre-existing flakiness in the localhost smoke job.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.include_staging == 'true') ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging E2E tests
        run: pnpm run test:e2e:staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          # Optional: bypass Vercel Deployment Protection (SSO wall) on
          # preview deploys. Generate in Vercel → Settings → Deployment
          # Protection → "Protection Bypass for Automation".
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        timeout-minutes: 10

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Unique suffix per run so reports accumulate instead of
          # overwriting each other — lets us diff nightly runs week
          # over week.
          name: playwright-report-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: dashboard/playwright-report/
          # 90 days is the upper bound most plans support; keeps the
          # historical window long enough to investigate flakes that
          # only surface after a backend release.
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload test-results (screenshots + traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: dashboard/test-results/
          retention-days: 90
          if-no-files-found: ignore

      - name: Notify webhook on failure
        # Optional: if `STAGING_WEBHOOK_URL` is set (Slack / Discord /
        # generic incoming webhook), ping it with a one-line summary
        # and a link back to the run. Skips silently when the secret
        # is empty so forks + dev triggers don't fail.
        if: failure() && github.event_name == 'schedule'
        env:
          WEBHOOK_URL: ${{ secrets.STAGING_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "STAGING_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi
          payload=$(cat <<EOF
          {
            "text": ":rotating_light: Nightly staging e2e failed on \`${{ github.ref_name }}\`. Run: ${RUN_URL}"
          }
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" \
            --data "$payload" "$WEBHOOK_URL" || true
