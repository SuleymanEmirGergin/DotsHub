# Dashboard: contract checks + E2E (Node, Playwright)
name: Dashboard tests

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"

defaults:
  run:
    working-directory: dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm run test:routes && pnpm run test:i18n-contract

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm run dev &
        env:
          CI: "true"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 2; done

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        timeout-minutes: 5
