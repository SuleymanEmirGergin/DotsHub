# Dashboard: contract checks + E2E (Node, Playwright)
name: Dashboard tests

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  workflow_dispatch:
    inputs:
      include_staging:
        description: "Run the live-staging e2e suite against the staging Supabase"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  # Nightly staging regression — runs the full live-staging e2e suite
  # against the deployed Vercel preview + staging Supabase, so Supabase
  # / Vercel / deploy drift is caught without waiting for the next PR.
  # Runs only e2e-staging (localhost smoke is gated on push/PR paths).
  schedule:
    - cron: "0 6 * * *"

defaults:
  run:
    working-directory: dashboard

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    # localhost smoke — push + PR + manual dispatch. Skip on schedule
    # so the nightly cron runs only `e2e-staging`.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract tests
        run: pnpm run test:routes && pnpm run test:i18n-contract

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm run dev &
        env:
          CI: "true"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break; sleep 2; done

      - name: Run localhost E2E tests
        run: pnpm exec playwright test --project=localhost
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        timeout-minutes: 5

  e2e-staging:
    # Live-staging run triggered by either:
    #   - workflow_dispatch with include_staging=true (manual on-demand)
    #   - scheduled cron (nightly regression against staging)
    # Never runs on push/PR automatically so regular commits don't
    # pollute staging Supabase.
    #
    # Intentionally independent of `test` — staging exercises real
    # Supabase auth + data against a deployed URL and must not be held
    # hostage to pre-existing flakiness in the localhost smoke job.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.include_staging == 'true') ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run staging E2E tests
        run: pnpm run test:e2e:staging
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_TEST_ADMIN_EMAIL: ${{ secrets.STAGING_TEST_ADMIN_EMAIL }}
          # Optional: bypass Vercel Deployment Protection (SSO wall) on
          # preview deploys. Generate in Vercel → Settings → Deployment
          # Protection → "Protection Bypass for Automation".
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        timeout-minutes: 10

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: dashboard/playwright-report/
          retention-days: 7
