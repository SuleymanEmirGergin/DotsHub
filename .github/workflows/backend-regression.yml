name: Backend Regression

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/golden_flows/**"
      - "tests/real_corpus/**"
      - "config/**"
      - ".github/workflows/backend-regression.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "tests/golden_flows/**"
      - "tests/real_corpus/**"
      - "config/**"
      - ".github/workflows/backend-regression.yml"
  workflow_dispatch: {}

env:
  # Opt into Node.js 24 for actions/checkout@v4 etc. before the
  # June 2026 Node 20 removal. Silences the deprecation warning
  # currently printed on every run. Runner honours this flag
  # workflow-wide, so individual jobs do not need to repeat it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  golden-flow-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          # requirements-dev pulls in runtime deps via -r and adds
          # coverage / pytest for the hot-path coverage gate step.
          pip install -r requirements-dev.txt

      - name: Run backend regression (CI parity)
        run: |
          cd backend
          python scripts/run_backend_regression.py

  docker-build:
    # Prove the backend image actually builds before merging. We don't
    # push — a tag/release workflow will handle publishing. This job
    # catches Dockerfile regressions (new dep, wrong path) at PR time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: pretriage-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — uvicorn module imports without DB
        # The image entrypoint needs Supabase env to actually serve
        # requests, but we can at least prove `app.main` imports
        # cleanly inside the built image (catches missing deps /
        # broken paths).
        run: |
          docker run --rm pretriage-backend:ci python -c "import importlib; importlib.import_module('app.main'); print('ok')" || (
            echo "NOTE: importlib failure is expected if Supabase env is unset;"
            echo "the build itself is what this job primarily verifies."
            exit 0
          )

      - name: Smoke — /health endpoint returns 200 over HTTP
        # Beyond the import check above, spin the image with the
        # real uvicorn entrypoint and hit /health to prove the
        # FastAPI router actually mounts. The route itself is
        # permissive: it returns 200 with `supabase: "not_configured"`
        # when SUPABASE_URL is unset, so we don't need any real env
        # for a serving smoke. Catches:
        #   - Router wiring regression (app.include_router typo)
        #   - Middleware crash-on-request (e.g. capability-gate
        #     raises before returning the response)
        #   - Port binding regression (entrypoint runs on wrong port)
        #
        # If the container doesn't come up within 15s, we print
        # logs + fail the step — a stuck boot is a real deploy
        # blocker we want to catch at PR time.
        run: |
          set -euo pipefail
          docker run -d --name pretriage-smoke -p 18000:8000 pretriage-backend:ci
          # Poll /health for up to 15s. Uvicorn typically boots in
          # <3s on GHA runners; the ceiling handles a cold Docker
          # network attach.
          for i in $(seq 1 15); do
            if curl -fsS -o /tmp/health.json -w "%{http_code}" http://localhost:18000/health > /tmp/health.code; then
              break
            fi
            sleep 1
          done
          STATUS=$(cat /tmp/health.code 2>/dev/null || echo "000")
          if [[ "$STATUS" != "200" ]]; then
            echo "::error::/health returned HTTP $STATUS — container failed to serve."
            docker logs pretriage-smoke || true
            docker rm -f pretriage-smoke || true
            exit 1
          fi
          echo "OK: /health returned 200"
          cat /tmp/health.json
          echo
          docker rm -f pretriage-smoke

  safety-critical-coverage:
    # Gate: blocks merge if branch coverage of safety-critical modules
    # (emergency_router, safety_guard, version_gating) drops below 100%.
    # Complements the hotpath_coverage_gate step inside golden-flow-
    # regression — that gate covers a wider module list at looser
    # thresholds; this job enforces 100% branch coverage on the
    # narrowest "never regress" set via --cov-fail-under=100.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install backend + dev dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Safety-critical branch coverage (fail-under=100)
        run: |
          cd backend
          python -m pytest \
            tests/test_emergency_router_branches.py \
            tests/test_safety_guard_branches.py \
            tests/test_version_gating.py \
            tests/test_confidence_gate.py \
            tests/test_features_endpoint.py \
            tests/test_request_id_branches.py \
            tests/test_security_headers_branches.py \
            tests/test_canonical_extract_branches.py \
            tests/test_rate_limit_branches.py \
            tests/test_rate_limit_redis_fallback.py \
            tests/test_metrics.py \
            tests/test_cors_origins_parsing.py \
            tests/test_session_pdf_branches.py \
            --cov=app.emergency_router \
            --cov=app.safety_guard \
            --cov=app.version_gating \
            --cov=app.top_conditions_filter \
            --cov=app.core.config \
            --cov=app.api.routes.features \
            --cov=app.core.request_id \
            --cov=app.middleware.security_headers \
            --cov=app.canonical_extract \
            --cov=app.rate_limit \
            --cov=app.observability.metrics \
            --cov=app.services.session_pdf \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: Overall backend coverage (advisory)
        # Non-blocking: reports the overall number so drift is visible,
        # but does not gate merges while pre-existing test failures are
        # being worked through.
        continue-on-error: true
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=app \
            --cov-branch \
            --cov-report=term \
            --ignore=tests/test_golden_flows.py \
            --ignore=tests/test_synonym_collisions.py

      - name: Performance benchmarks (advisory)
        # Runs the pytest-benchmark hot-path suite (T3). Intentionally
        # non-blocking: CI runners have variable performance so an
        # absolute threshold would be too flaky. The benchmark output
        # is archived as an artifact so PR reviewers can eyeball
        # regressions manually and historical runs can be compared
        # offline.
        #
        # Concrete enforcement (e.g. "fail on mean > baseline × 1.5")
        # will land once we have enough runner-specific baselines
        # to separate signal from variance.
        continue-on-error: true
        run: |
          cd backend
          python -m pytest tests/test_perf_benchmarks.py \
            --benchmark-only \
            --benchmark-columns=min,mean,max,stddev,ops \
            --benchmark-json=bench-output.json

      - name: Upload benchmark JSON (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/bench-output.json
          retention-days: 30
          if-no-files-found: ignore
