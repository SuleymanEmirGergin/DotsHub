name: Backend Regression

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/golden_flows/**"
      - "config/kaggle_mapping_guardrails.json"
      - ".github/workflows/backend-regression.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "tests/golden_flows/**"
      - "config/kaggle_mapping_guardrails.json"
      - ".github/workflows/backend-regression.yml"
  workflow_dispatch: {}

jobs:
  golden-flow-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend regression (CI parity)
        run: |
          cd backend
          python scripts/run_backend_regression.py

  safety-critical-coverage:
    # Gate: blocks merge if branch coverage of safety-critical modules
    # (emergency_router, safety_guard) drops below 100%.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements-dev.txt"

      - name: Install backend + dev dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Safety-critical branch coverage (fail-under=100)
        run: |
          cd backend
          python -m pytest \
            tests/test_emergency_router_branches.py \
            tests/test_safety_guard_branches.py \
            tests/test_version_gating.py \
            --cov=app.emergency_router \
            --cov=app.safety_guard \
            --cov=app.version_gating \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100

      - name: Overall backend coverage (advisory)
        # Non-blocking: reports the overall number so drift is visible,
        # but does not gate merges while pre-existing test failures are
        # being worked through.
        continue-on-error: true
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=app \
            --cov-branch \
            --cov-report=term \
            --ignore=tests/test_golden_flows.py \
            --ignore=tests/test_synonym_collisions.py
