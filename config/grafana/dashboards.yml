# Grafana provisioning — auto-import the Dotshub dashboard on container
# start. Mounted into the Grafana container at
#   /etc/grafana/provisioning/dashboards/dashboards.yml
# The `path` below matches the bind mount in docker-compose.monitoring.yml
# (`./config/grafana → /var/lib/grafana/dashboards`). The referenced
# `${DS_PROMETHEUS}` in the dashboard JSON is resolved via the
# datasource provisioned by datasources.yml.

apiVersion: 1

providers:
  - name: dotshub
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
