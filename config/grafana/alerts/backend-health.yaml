# Backend health alerts — Prometheus / Mimir rules format.
#
# Uploaded to Grafana Cloud Managed Alertmanager via `cortextool` or the
# `.github/workflows/observability-sync.yml` workflow on every push to
# `main` that touches config/grafana/alerts/**.
#
# Why rules-as-code instead of Grafana UI: PR review + diff history,
# not a pile of tribal-knowledge dashboards someone clicked into
# existence. Roll-back = git revert.
#
# Severity conventions (wired to notifier routing in Grafana Cloud):
#   critical — wake someone up
#   warning  — next-business-day; Slack #alerts
#   info     — passive dashboard signal; no paging

groups:
  - name: backend-http
    interval: 1m
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_requests_total[5m])), 1)
            > 0.02
        for: 5m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend 5xx rate > 2% for 5+ minutes"
          description: |
            {{ $value | humanizePercentage }} of backend requests are 5xx.
            Check recent deploys / Sentry for the correlating exception.
            Dashboard: https://<stack>.grafana.net/d/triaige-pretriage

      - alert: BackendLatencyRegression
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend p95 latency > 2s for 10+ minutes"
          description: |
            p95 at {{ $value | humanizeDuration }}. If it didn't coincide
            with a deploy, check downstream (Supabase / Wiro / Redis)
            latency.

  - name: backend-rate-limit
    interval: 1m
    rules:
      - alert: RateLimitDeniedRateHigh
        expr: |
          sum(rate(rate_limit_hits_total{outcome="denied"}[10m]))
            /
          clamp_min(sum(rate(rate_limit_hits_total[10m])), 1)
            > 0.05
        for: 15m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Rate-limit denied fraction > 5% sustained 15m"
          description: |
            {{ $value | humanizePercentage }} of requests hit a cap.
            Check if (a) abuse campaign — block at CDN, or (b) legit
            growth — raise RATE_LIMIT_MAX_REQ / ADMIN_RATE_LIMIT_MAX_REQ.

      - alert: LLMNluRateLimitSaturated
        expr: |
          sum(rate(rate_limit_hits_total{bucket="llm_nlu",outcome="denied"}[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: backend
          bucket: llm_nlu
        annotations:
          summary: "LLM-NLU Wiro quota bucket is denying requests"
          description: |
            The global LLM-NLU cap ({{ $labels.bucket }}) is rejecting.
            Either the Wiro quota is genuinely exhausted, or
            LLM_NLU_RATE_LIMIT_MAX_REQ is too tight for current traffic.

      - alert: LLMNluSuccessRateLow
        # Grafana-side companion to the in-memory webhook alert in
        # `backend/app/services/llm_nlu.py::_health_monitor_observe`.
        # The webhook pages on a 20-call rolling window at 80% — that's
        # low-latency incident-response. This rule aggregates across all
        # workers + the last 15 minutes and alerts when Wiro + the
        # deterministic fallback pipeline as a whole drops below 80%
        # success. Handles the case where a single worker's webhook
        # already fired hours ago (cool-down) but the provider is still
        # flaky; this rule re-fires every 15m until clear.
        expr: |
          sum(rate(llm_nlu_calls_total{success="true"}[15m]))
            /
          clamp_min(sum(rate(llm_nlu_calls_total[15m])), 0.001)
            < 0.80
        for: 15m
        labels:
          severity: warning
          service: backend
          category: llm-health
        annotations:
          summary: "LLM NLU success rate < 80% for 15m (cross-worker)"
          description: |
            Success rate {{ $value | humanizePercentage }} over the
            last 15 minutes of LLM NLU calls (aggregated across all
            workers). The webhook alert fires per-worker on a 20-call
            window; this rule catches sustained provider degradation
            that crosses the cool-down and covers multi-worker
            deployments where a single process' ring buffer stays
            under quota. Runbook:
            docs/runbooks/LLM_PROVIDER_DOWN.md.

      - alert: RateLimitDenialSpikePerBucket
        # Sudden denial-rate spike inside a single bucket (not just
        # overall). Normal steady-state is <1% denial for every
        # bucket except `llm_nlu` (noisier by design). >10% denial
        # sustained 15m on any bucket signals either an abuse
        # campaign on that specific endpoint or a traffic surge
        # overflowing the cap.
        # Using `sum by (bucket)` so the alert's label carries WHICH
        # bucket is hot — on-call can triage straight from the page
        # without a dashboard round-trip.
        expr: |
          sum by (bucket) (rate(rate_limit_hits_total{outcome="denied"}[5m]))
            /
          clamp_min(sum by (bucket) (rate(rate_limit_hits_total[5m])), 0.001)
            > 0.10
        for: 15m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Rate-limit denial spike on bucket {{ $labels.bucket }}"
          description: |
            {{ $value | humanizePercentage }} of last-5m requests to
            the `{{ $labels.bucket }}` bucket are being denied.
            Steady-state should be <1% on every bucket except
            `llm_nlu`. If this is `admin` → check for credential
            brute-force; if `default` → legit traffic surge or an
            abuse campaign hitting /v1/triage/turn.

  - name: backend-latency
    interval: 1m
    rules:
      - alert: TriageEndpointLatencyRegression
        # p95 latency on triage routes reflects the downstream chain:
        # canonical extraction + scoring + (optionally) LLM NLU +
        # Supabase write. Baseline p95 sits around 800ms-1.2s. A
        # sustained 10-minute p95 >3s on any `/v1/triage/*` handler
        # implicates one of the downstreams. When this fires,
        # correlate with the LLM health webhook + Supabase `/health`
        # response to identify which one regressed.
        # This alert is the GRAFANA-SIDE PROXY for the LLM NLU
        # health signal. The canonical LLM-success alert fires via
        # notifier.send_llm_health_alert() (Slack/Discord webhook)
        # because there's no Prometheus counter for LLM success.
        # See docs/OBSERVABILITY.md "LLM NLU health" section.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, handler) (
              rate(http_request_duration_seconds_bucket{handler=~"/v1/triage.*"}[5m])
            )
          ) > 3
        for: 10m
        labels:
          severity: warning
          service: backend
          category: latency
        annotations:
          summary: "Triage endpoint p95 > 3s (handler={{ $labels.handler }})"
          description: |
            p95 on `{{ $labels.handler }}` is
            {{ $value | humanizeDuration }}. Typical baseline is
            800ms-1.2s. Likely cause: downstream degradation
            (Supabase write / LLM provider latency). Check:
              - Admin LLM Health card: /admin/analytics
              - docs/runbooks/LLM_PROVIDER_DOWN.md
              - docs/runbooks/SUPABASE_DOWN.md
              - Supabase status: https://status.supabase.com

      - alert: SupabaseWriteLatencyProxy
        # Superseded for the instrumented operations (upsert_session,
        # insert_event, insert_feedback) by SupabaseDbLatencyP99High
        # below. This proxy rule stays active because the admin-path
        # .table().execute() call sites in admin_api.py + admin_v5.py
        # are NOT yet routed through `_timed_supabase`, so they
        # contribute only to HTTP latency. Retire this rule once the
        # admin paths migrate + the direct DB metric reliably covers
        # every write surface.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                handler=~"/v1/(triage|admin/feedback).*"
              }[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: backend
          category: latency
          downstream: supabase
        annotations:
          summary: "Write-path p95 > 2s (Supabase latency proxy)"
          description: |
            p95 on write-heavy handlers is
            {{ $value | humanizeDuration }}. Typical baseline
            <500ms. Runbook: docs/runbooks/SUPABASE_DOWN.md.
            Companion alert `SupabaseDbLatencyP99High` reads the
            native supabase_db_latency_seconds histogram — cross-
            check both when triaging.

      - alert: SupabaseDbErrorRateHigh
        # Native Supabase client error-rate alert. Fires when the
        # `_timed_supabase` counter observes >2% error outcomes
        # across all instrumented operations in a 5-minute window,
        # sustained for 5 minutes. Stricter than the HTTP 5xx alert
        # because a Supabase error is ALWAYS a real problem — it
        # means the wrapped `.execute()` raised, which in turn means
        # either auth is broken, the schema drifted, or Supabase
        # itself returned a 5xx. Operation label goes in the page
        # so ops sees which table/verb blew up without a dashboard
        # trip.
        expr: |
          sum by (operation) (rate(supabase_db_calls_total{outcome="error"}[5m]))
            /
          clamp_min(sum by (operation) (rate(supabase_db_calls_total[5m])), 0.001)
            > 0.02
        for: 5m
        labels:
          severity: critical
          service: backend
          category: database
          downstream: supabase
        annotations:
          summary: "Supabase error rate >2% on {{ $labels.operation }}"
          description: |
            {{ $value | humanizePercentage }} of recent
            `{{ $labels.operation }}` calls raised. Possible causes
            in rough priority order: SUPABASE_SERVICE_ROLE_KEY
            rotated and not redeployed (check /health `supabase`
            field), schema migration drift, Supabase provider
            incident (status.supabase.com), connection-pool
            exhaustion under load. Runbook:
            docs/runbooks/SUPABASE_DOWN.md.

      - alert: SupabaseDbLatencyP99High
        # p99 latency alarm on the native client histogram. 2s p99
        # sustained 10m is the threshold below which a real
        # session-save regression starts to be visible to users as
        # a spinner on the chat screen. Tighter than the HTTP-layer
        # proxy (2s p95) because this reads the direct metric and
        # we can take the p99 without noise from orthogonal work in
        # the handler.
        expr: |
          histogram_quantile(
            0.99,
            sum by (le, operation) (
              rate(supabase_db_latency_seconds_bucket[5m])
            )
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: backend
          category: database
          downstream: supabase
        annotations:
          summary: "Supabase p99 > 2s on {{ $labels.operation }}"
          description: |
            p99 on `{{ $labels.operation }}` is
            {{ $value | humanizeDuration }}. Typical baseline
            <500ms. Connection-pool exhaustion under load is the
            most frequent cause; swap to SUPABASE_DB_POOLER_URL if
            not already in use (.env.example documents both).
            Runbook: docs/runbooks/SUPABASE_DOWN.md.

  - name: backend-triage
    interval: 1m
    rules:
      - alert: EmergencyEnvelopeSpike
        # 3x over the 1-hour baseline on a 15m window. Ambient spikes
        # (nightshift cardio panic waves) are normal; 3x sustained is a
        # rule-regression or data anomaly worth looking at.
        expr: |
          sum(rate(triage_envelope_total{envelope_type="EMERGENCY"}[15m]))
            /
          clamp_min(
            avg_over_time(
              sum(rate(triage_envelope_total{envelope_type="EMERGENCY"}[15m]))[1h:15m]
            ),
            0.001
          )
            > 3
        for: 15m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "EMERGENCY envelope rate 3x over 1h baseline"
          description: |
            Possible signal, possible rule regression. Compare against
            `config/emergency_rules.json` last-edit time; if correlated,
            roll back.

      - alert: CapabilityGateStripRateUnusuallyHigh
        # Healthy steady-state: most clients update within weeks of a
        # protocol bump. >50% strips for 24h = old version stuck in the
        # field → push a forced-update via MIN_CLIENT_VERSION.
        expr: |
          sum(rate(capability_gate_filtered_total[1h]))
            /
          clamp_min(sum(rate(http_requests_total[1h])), 1)
            > 0.5
        for: 24h
        labels:
          severity: info
          service: backend
        annotations:
          summary: "Capability-gate stripping >50% of responses for 24h"
          description: |
            Old-version clients dominate traffic. Consider flipping
            CLIENT_VERSION_ENFORCEMENT from warn → block on stale
            versions (see docs/OPS_VERSION_GATE_ROLLOUT.md).

  - name: backend-quote-summary
    interval: 1m
    rules:
      - alert: QuoteSummaryHighEmptyRate
        # Background-task LLM run that produced no usable text. A few %
        # is normal (network blips, rate-limit retries); >30% sustained
        # means the prompt or a provider degraded — the cache stays
        # empty and patient-facing summary_tr stays None across requests.
        expr: |
          sum(rate(quote_summary_total{outcome="empty"}[10m]))
            /
          clamp_min(
            sum(rate(quote_summary_total{outcome=~"success|empty|error"}[10m])),
            0.001
          )
            > 0.30
        for: 15m
        labels:
          severity: warning
          service: backend
          category: llm-health
        annotations:
          summary: "quote_summary empty-rate >30% for 15m"
          description: |
            {{ $value | humanizePercentage }} of quote_summary
            generation attempts returned an empty body. Likely causes
            in priority order: (1) primary provider rate-limited or
            credentials rotated and not redeployed, (2) prompt drift
            from recent edits to services/quote_summary.py, (3) Wiro
            outage — check status. Fallback provider should kick in
            but is also returning empty if this fires for both.
            Runbook: docs/runbooks/WIRO_CREDENTIAL_ROTATION.md (auth
            issues) + status.wiro.ai. Patient impact: bounded —
            QUOTE envelope still returns ranked clinics, summary_tr
            just stays None.

      - alert: QuoteSummaryHighErrorRate
        # Provider raised (HTTP 5xx, timeout, network). Less benign
        # than empty — indicates an actual outage path. We alert
        # earlier (10% / 10m) than empty-rate.
        expr: |
          sum(rate(quote_summary_total{outcome="error"}[5m]))
            /
          clamp_min(
            sum(rate(quote_summary_total{outcome=~"success|empty|error"}[5m])),
            0.001
          )
            > 0.10
        for: 10m
        labels:
          severity: warning
          service: backend
          category: llm-health
        annotations:
          summary: "quote_summary error-rate >10% on at least one provider"
          description: |
            {{ $value | humanizePercentage }} of quote_summary calls
            raised an exception during the last 5m. Drill into
            ``quote_summary_total`` by ``provider`` label to find which
            tier is failing. Common causes: WIRO_API_SECRET expired,
            Wiro upstream incident, network partition. The fallback
            chain mitigates but does NOT mask — both tiers can fail
            on the same root cause (auth, network).

      - alert: QuoteSummaryLatencyHigh
        # p95 generation wall-clock >30s sustained 15m. Background
        # task so this is NOT a user-facing latency, it's a cost +
        # cache-warmup signal: long generations mean the cache stays
        # cold longer and patients get summary_tr=None for more
        # consecutive QUOTE responses than designed.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, provider) (
              rate(quote_summary_latency_seconds_bucket[5m])
            )
          ) > 30
        for: 15m
        labels:
          severity: info
          service: backend
          category: llm-health
        annotations:
          summary: "quote_summary p95 >30s on {{ $labels.provider }}"
          description: |
            Background generation p95 on `{{ $labels.provider }}` is
            {{ $value | humanizeDuration }}. Typical Qwen / GPT-5-mini
            falls in 5-15s range. Sustained >30s means Wiro is queue-
            saturated; consider raising QUOTE_SUMMARY_LLM_TIMEOUT_SECONDS
            ONLY if cost is acceptable, or swap provider order via
            QUOTE_SUMMARY_LLM_PROVIDERS. Patient impact: low — the
            cache eventually warms; new requests for cached combos
            still get the blurb.

      - alert: QuoteSummaryCacheHitRateLow
        # Hit rate is the cache health signal. After warmup, hit rate
        # should be 80%+ (most patients query a small set of popular
        # procedure-clinic-locale combos). Sustained <40% means either
        # (a) very high-cardinality traffic, or (b) cache TTL too tight
        # for the read pattern.
        expr: |
          sum(rate(quote_summary_cache_total{result="hit"}[30m]))
            /
          clamp_min(sum(rate(quote_summary_cache_total[30m])), 0.001)
            < 0.40
        for: 1h
        labels:
          severity: info
          service: backend
          category: cache-health
        annotations:
          summary: "quote_summary cache hit-rate <40% for 1h"
          description: |
            Hit rate {{ $value | humanizePercentage }} across the last
            30 minutes, sustained 1h. Likely (a) traffic skew toward
            new procedure-clinic combos (post-launch, post clinic
            expansion), or (b) QUOTE_SUMMARY_CACHE_TTL_SECONDS too
            short for the read frequency. Bumping cache size /
            TTL is a per-process tweak; multi-instance deployments
            need Redis (deferred).

  - name: backend-patient-upload
    interval: 1m
    rules:
      - alert: PatientUploadHighErrorRate
        # Provider raised an exception during AI dispatch. Less benign
        # than empty (auth gate). >10% / 10m = upstream Wiro outage,
        # network partition, or a regression in the wrapper layer.
        expr: |
          sum by (kind) (rate(patient_upload_total{outcome="error"}[5m]))
            /
          clamp_min(
            sum by (kind) (rate(patient_upload_total{outcome=~"success|empty|error"}[5m])),
            0.001
          )
            > 0.10
        for: 10m
        labels:
          severity: warning
          service: backend
          category: ai-dispatch
        annotations:
          summary: "patient_upload error-rate >10% on kind={{ $labels.kind }}"
          description: |
            {{ $value | humanizePercentage }} of patient uploads on
            kind=`{{ $labels.kind }}` raised in the last 5m. Drill
            into Sentry for the breadcrumb trail (asset_id +
            provider). Common causes: WIRO_API_SECRET expired
            (runbook: docs/runbooks/WIRO_CREDENTIAL_ROTATION.md),
            Wiro upstream incident, or a wrapper-layer regression
            after a recent deploy.

      - alert: PatientUploadHighEmptyRate
        # Provider returned None / empty — typically an auth or
        # feature-flag misconfiguration: the wrapper hit
        # WiroAuthError or had its WIRO_*_ENABLED flag off and
        # surfaced None. >30% / 15m means the operator hasn't
        # finished onboarding the credentials for that kind's
        # service.
        expr: |
          sum by (kind) (rate(patient_upload_total{outcome="empty"}[10m]))
            /
          clamp_min(
            sum by (kind) (rate(patient_upload_total{outcome=~"success|empty|error"}[10m])),
            0.001
          )
            > 0.30
        for: 15m
        labels:
          severity: warning
          service: backend
          category: ai-dispatch
        annotations:
          summary: "patient_upload empty-rate >30% on kind={{ $labels.kind }}"
          description: |
            {{ $value | humanizePercentage }} of patient uploads on
            kind=`{{ $labels.kind }}` returned an empty result. Most
            likely WIRO_*_ENABLED off for the bound service or
            WIRO_API_SECRET missing. Patient impact: row stays in
            "failed" state, ai_error column carries the human-readable
            cause.

      - alert: PatientUploadLatencyHigh
        # p95 dispatch latency by kind. Different kinds have different
        # baselines: image/moondream ~5-15s, video/cogvlm 30-60s,
        # audio/whisper 5-30s. Single threshold (60s) catches video
        # tail bloating + image regression simultaneously without
        # per-kind tuning.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, kind) (
              rate(patient_upload_latency_seconds_bucket[5m])
            )
          ) > 60
        for: 15m
        labels:
          severity: info
          service: backend
          category: ai-dispatch
        annotations:
          summary: "patient_upload p95 >60s on kind={{ $labels.kind }}"
          description: |
            Background dispatch p95 on kind=`{{ $labels.kind }}` is
            {{ $value | humanizeDuration }}. NOT a user-facing
            latency (BG task), but cache stays cold longer than
            designed. Wiro queue saturation or a regressed prompt;
            check llm_calls + Wiro task dashboards.

  - name: backend-availability
    interval: 30s
    rules:
      - alert: BackendScrapeDown
        # up == 0 means the Grafana Agent couldn't reach /metrics.
        # Could be: backend dead, backend unresponsive, agent network
        # split, or /metrics route unmounted (bad deploy).
        expr: up{service="backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Grafana Agent cannot scrape backend /metrics"
          description: |
            `up` has been 0 for 2+ minutes. Verify the backend is
            running (platform console) and /metrics is reachable from
            the agent host (`curl -s <backend>:8000/metrics | head`).
