[pytest]
testpaths = tests
python_files = test_*.py
python_classes = *Tests *Test
python_functions = test_*
addopts = --tb=short --strict-markers

[coverage:run]
source = app
omit =
    app/agents/*
    app/data/*
    app/prompts/*
    app/scripts/*

[coverage:report]
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
