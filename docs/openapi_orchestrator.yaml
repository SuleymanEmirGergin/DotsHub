openapi: 3.1.0
info:
  title: PreTriage Orchestrator API
  version: "0.1.0"
  description: |
    Primary API contract for integrations.
    Unified triage: POST /v1/triage/turn; feedback, history, send-summary, export-summary,
    push-token, facilities, and /health are documented below.

    ## Client capability protocol

    Every `/v1/*` request MAY send `X-Client-Version` and
    `X-Client-Capabilities` headers. The server strips payload fields
    whose capability token the client did not advertise. Missing
    header = minimal baseline (no gated fields). See
    `components/parameters/ClientCapabilitiesHeader` and
    `docs/client_versioning.md` for the registry of tokens.
servers:
  - url: http://localhost:8000
    description: Local development
x-default-integration-path:
  backend_app: app.main
  mobile_endpoint: /v1/triage/turn
paths:
  /v1/triage/turn:
    post:
      summary: Run one triage turn (single endpoint, single envelope)
      operationId: triageTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageTurnRequest"
            examples:
              start:
                summary: Start new session with symptoms
                value:
                  session_id: null
                  user_message: "Başım ağrıyor"
                  locale: "tr-TR"
              answer:
                summary: Answer a yes/no question
                value:
                  session_id: "c2c6e2d3-8d39-4b3d-8e5a-0f2a6e9c8d11"
                  user_message: ""
                  answer:
                    canonical: "bulantı"
                    value: "yes"
                  locale: "tr-TR"
      responses:
        "200":
          description: Envelope response (QUESTION/RESULT/EMERGENCY/ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
              examples:
                question:
                  summary: System asks a follow-up question
                  value:
                    type: "QUESTION"
                    session_id: "c2c6e2d3-8d39-4b3d-8e5a-0f2a6e9c8d11"
                    turn_index: 1
                    payload:
                      question_id: "q_001"
                      canonical: "bulantı"
                      question_tr: "Mide bulantısı var mı?"
                      answer_type: "yes_no"
                      choices_tr: ["yes", "no"]
                      why_asking_tr: "Migren ve diğer olasılıkları ayırt etmek için."
                result:
                  summary: Final triage result
                  value:
                    type: "RESULT"
                    session_id: "c2c6e2d3-8d39-4b3d-8e5a-0f2a6e9c8d11"
                    turn_index: 3
                    payload:
                      urgency: "ROUTINE"
                      recommended_specialty:
                        id: "neurology"
                        name_tr: "Nöroloji"
                      top_conditions:
                        - disease_label: "Migraine"
                          score_0_1: 0.56
                          disease_description: "A migraine is a headache that can cause severe throbbing pain, usually on one side of the head."
                        - disease_label: "Sinusitis"
                          score_0_1: 0.22
                          disease_description: "Sinusitis is inflammation of the tissue lining the sinuses."
                      doctor_ready_summary_tr:
                        - "Baş ağrısı mevcut."
                        - "Işığa/sese hassasiyet: evet."
                        - "Bulantı: evet."
                      safety_notes_tr:
                        - "Bu bir ön değerlendirmedir, teşhis değildir."
                        - "Ani şiddetli baş ağrısı, konuşma bozukluğu, tek taraflı güçsüzlük olursa acile başvur."
                emergency:
                  summary: Emergency detected
                  value:
                    type: "EMERGENCY"
                    session_id: "S3"
                    turn_index: 1
                    payload:
                      urgency: "EMERGENCY"
                      reason_tr: "Göğüs baskısı + nefes darlığı/terleme acil değerlendirme gerektirebilir."
                      instructions_tr:
                        - "112'yi ara veya en yakın acile başvur."
                        - "Yalnızsan bir yakınını haberdar et."
                        - "Göğüs ağrısı artarsa bekleme."

  /v1/triage/feedback:
    post:
      summary: Submit user feedback on a triage result
      operationId: triageFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackIn"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackOut"
        "404":
          description: session_id not found

  /v1/triage/history:
    get:
      summary: List recent triage sessions for the device
      operationId: triageHistory
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: x-device-id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: List of session summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageHistoryResponse"

  /v1/triage/send-summary:
    post:
      summary: Send session summary by email
      operationId: sendSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendSummaryRequest"
      responses:
        "200":
          description: Email sent or queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  message: { type: string }
        "404":
          description: Session not found

  /v1/triage/export-summary:
    post:
      summary: Export session summary as plain text (locale-aware)
      operationId: exportSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportSummaryRequest"
      responses:
        "200":
          description: Plain text summary
          content:
            text/plain:
              schema: { type: string }

  /v1/triage/push-token:
    post:
      summary: Register or update Expo Push Token for a device
      operationId: registerPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenResponse"
        "503":
          description: Persist failed (production)
    delete:
      summary: Unregister (deactivate) push token for a device
      operationId: unregisterPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenDeleteRequest"
      responses:
        "200":
          description: Token deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTokenResponse"

  /v1/facilities:
    get:
      summary: List facilities by specialty and optional location
      operationId: getFacilities
      parameters:
        - name: specialty
          in: query
          required: true
          schema: { type: string }
          description: Specialty key (e.g. neurology, cardiology)
        - name: city
          in: query
          schema: { type: string }
        - name: lat
          in: query
          schema: { type: number }
        - name: lon
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Facility list with items and disclaimer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilitiesResponse"

  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }

components:
  parameters:
    ClientVersionHeader:
      name: X-Client-Version
      in: header
      required: false
      schema:
        type: string
      description: |
        Free-form client version string. Logged for analytics; does NOT
        gate payload shape.
    ClientCapabilitiesHeader:
      name: X-Client-Capabilities
      in: header
      required: false
      schema:
        type: string
      description: |
        Comma-separated capability tokens the client can parse. The
        server strips any response field whose capability token is
        absent. Missing header = minimal baseline (nothing gated-in).

        Known tokens (see docs/client_versioning.md):
          - `curated_meta`        — unlocks `Envelope.payload.top_conditions[*]` curated fields (icd10, disease_description_tr, self_care_tr, …).
          - `emergency_specialty` — unlocks `Envelope.payload.recommended_specialty` on EMERGENCY envelopes.

        Unknown tokens are silently ignored (forward-compatible).
      example: "curated_meta,emergency_specialty"

  schemas:
    TriageTurnRequest:
      type: object
      required: [locale]
      properties:
        session_id:
          type: ["string", "null"]
          description: "null means start new session"
        locale:
          type: string
          default: "tr-TR"
        user_message:
          type: string
          description: "Free text symptoms (empty allowed when answering)"
        answer:
          type: ["object", "null"]
          description: "User answer to the last question"
          properties:
            canonical:
              type: string
            value:
              type: string

    Envelope:
      type: object
      required: [type, session_id, turn_index, payload]
      properties:
        type:
          type: string
          enum: ["QUESTION", "RESULT", "EMERGENCY", "ERROR"]
        session_id:
          type: string
        turn_index:
          type: integer
        payload:
          oneOf:
            - $ref: "#/components/schemas/QuestionPayload"
            - $ref: "#/components/schemas/ResultPayload"
            - $ref: "#/components/schemas/EmergencyPayload"
            - $ref: "#/components/schemas/ErrorPayload"
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      properties:
        disclaimer_tr:
          type: string
          default: "Bu uygulama tanı koymaz; bilgilendirme ve yönlendirme amaçlıdır."
        timestamp:
          type: string
          format: date-time

    QuestionPayload:
      type: object
      required: [question_id, canonical, question_tr, answer_type]
      properties:
        question_id:
          type: string
        canonical:
          type: string
        question_tr:
          type: string
        answer_type:
          type: string
          enum: ["yes_no", "free_text", "number", "multi_choice"]
        choices_tr:
          type: ["array", "null"]
          items: { type: string }
        why_asking_tr:
          type: ["string", "null"]

    ResultPayload:
      type: object
      required: [urgency, recommended_specialty, top_conditions, doctor_ready_summary_tr, safety_notes_tr]
      properties:
        urgency:
          type: string
          enum: ["EMERGENCY", "SAME_DAY", "ROUTINE"]
        recommended_specialty:
          type: object
          required: [id, name_tr]
          properties:
            id: { type: string }
            name_tr: { type: string }
        top_conditions:
          type: array
          items:
            type: object
            required: [disease_label, score_0_1]
            properties:
              disease_label: { type: string }
              score_0_1: { type: number }
              disease_description: { type: string }
        doctor_ready_summary_tr:
          type: array
          items: { type: string }
        safety_notes_tr:
          type: array
          items: { type: string }

    EmergencyPayload:
      type: object
      required: [urgency, reason_tr, instructions_tr]
      properties:
        urgency:
          type: string
          enum: ["EMERGENCY"]
        reason_tr:
          type: string
        instructions_tr:
          type: array
          items: { type: string }

    ErrorPayload:
      type: object
      required: [code, message_tr]
      properties:
        code: { type: string }
        message_tr: { type: string }
        retryable:
          type: boolean
          default: true

    FeedbackIn:
      type: object
      required: [session_id, rating]
      properties:
        session_id: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        comment: { type: string, maxLength: 2000 }
        user_selected_specialty_id: { type: string, maxLength: 80 }

    FeedbackOut:
      type: object
      properties:
        ok: { type: boolean, default: true }

    TriageHistoryResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              created_at: { type: string }
              envelope_type: { type: string }
              recommended_specialty_tr: { type: string }
              confidence_label_tr: { type: string }
              confidence_0_1: { type: number }
              stop_reason: { type: string }

    SendSummaryRequest:
      type: object
      required: [session_id, email]
      properties:
        session_id: { type: string }
        email: { type: string, format: email }
        locale: { type: string, default: "tr" }

    ExportSummaryRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: object }
        locale: { type: string, default: "tr-TR" }

    PushTokenRequest:
      type: object
      required: [expo_push_token, device_id]
      properties:
        expo_push_token: { type: string, minLength: 10, maxLength: 256 }
        device_id: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, default: "unknown", maxLength: 20 }
        locale: { type: string, default: "tr-TR", maxLength: 10 }

    PushTokenDeleteRequest:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, minLength: 1, maxLength: 128 }

    PushTokenResponse:
      type: object
      properties:
        ok: { type: boolean, default: true }

    FacilitiesResponse:
      type: object
      properties:
        specialty_id: { type: string }
        city: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              address: { type: string }
              lat: { type: number }
              lon: { type: number }
              distance_km: { type: number }
        disclaimer: { type: string }
