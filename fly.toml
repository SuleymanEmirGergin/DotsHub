# Fly.io app manifest for the Dotshub backend.
#
# Runtime shape
# -------------
# - Primary region: ams (Amsterdam). EU-resident users + Grafana Cloud
#   EU-central observability endpoint → sub-50ms metric push.
# - 1× shared-cpu-1x VM @ 512 MB. Sufficient for the current API mix
#   (triage turns are CPU-bounded for ~100-200ms each, memory
#   dominated by the in-memory canonical/config dicts ~80 MB).
# - auto_stop_machines = "stop" + min_machines_running = 0 → scale-to-
#   zero when idle. Cold start latency on first hit after idle is
#   ~2-3s (uvicorn + config load). Acceptable for a hobby deploy;
#   raise min_machines_running to 1 when users care.
#
# Secrets
# -------
# Anything the runtime needs is set via `flyctl secrets set KEY=VALUE`.
# See docs/DEPLOY_FLY.md for the full required + optional list. Never
# commit secret values here; this file is public in the repo.
#
# Healthcheck
# -----------
# /health verifies Supabase reachability too (lib/supabase) so a
# degraded upstream also fails the Fly check and the machine is
# recycled. Keep grace_period long enough for cold start.

app = "triaige-backend"
primary_region = "ams"
# Keep fly.toml generator opt-out of "PaaS defaults" we don't need.
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  # Repo-root Dockerfile so we can COPY both backend/app/ and config/.
  dockerfile = "Dockerfile.fly"

[env]
  APP_ENV = "production"
  PORT = "8000"
  LOG_FORMAT = "json"
  LOG_LEVEL = "INFO"
  # Baked-in config tree inside the image (see Dockerfile.fly).
  PRETRIAGE_CONFIG_DIR = "/app/config"
  # Propagated as external_labels by the Grafana Agent sidecar
  # (config.river) and used by app/core/config.py for env-aware
  # behaviour (e.g. strict CORS).
  DEPLOYMENT_ENV = "production"
  SENTRY_ENVIRONMENT = "production"
  # Sentry traces: 10% sample is a safe production default (errors
  # always, 1 in 10 requests fully traced). Bump to 1.0 during an
  # incident via `flyctl secrets set`.
  SENTRY_TRACES_SAMPLE_RATE = "0.1"
  # ─── Observability sidecar config ───────────────────────────────
  # Alloy (Grafana Agent Flow) scrapes the backend /metrics endpoint.
  # Fly multi-process schedules two separate VMs (one per process
  # group), so the agent reaches the app process via Fly's internal
  # DNS — not loopback. The `app.process.<app>.internal` hostname
  # resolves ONLY to machines in the `app` process group, which
  # excludes the agent machine itself (no accidental self-scrape).
  #
  # Traffic stays on Fly's private 6PN mesh — zero public egress,
  # single-digit-ms latency between ams machines. Same env var is
  # visible to both processes; only `agent` consumes it.
  BACKEND_SCRAPE_TARGET = "app.process.triaige-backend.internal:8000"

# ─── HTTP service ──────────────────────────────────────────────────
#
# TLS + HTTPS is terminated at Fly's edge; the container only speaks
# plain HTTP on 8000. `force_https = true` makes the edge upgrade
# :80 → :443 before the request ever reaches us.

[http_service]
  internal_port = 8000
  force_https = true
  # Disable idle auto-stop entirely. The previous two iterations
  # ("stop" then "suspend") both still caused observable 35-65s
  # cold-start delays on first hit — enough to blow past mobile
  # HTTP timeouts ("NETWORK_ERROR" screens). Fly seems to keep
  # stopping even with min_machines_running=1 in some edge cases,
  # so we explicitly tell it never to stop. Single machine stays
  # warm 24/7.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Concurrency knobs — when any one is exceeded Fly considers the
  # machine "full" and routes new requests to another instance (or
  # starts one if auto_start_machines). Hard limit kills in-flight
  # requests on a struggling machine so the cluster stays healthy.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Sync healthcheck — Fly hits this from outside the machine; if 3
# consecutive fail, the machine is marked unhealthy and replaced.
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# ─── Processes ─────────────────────────────────────────────────────
#
# Two processes share the same Fly machine:
#
#   app   — uvicorn serving the FastAPI backend on :8000. Fly's edge
#           routes incoming HTTPS to this one (see [http_service]
#           processes = ["app"]).
#
#   agent — Grafana Alloy (Agent Flow). Reads config.river baked into
#           /etc/alloy/config.river, scrapes localhost:8000/metrics
#           every 15s, and remote_writes to Grafana Cloud using the
#           GRAFANA_CLOUD_PROM_* secrets. Not exposed externally;
#           admin UI stays on loopback 12345 for local debugging
#           (reachable only via `flyctl ssh console`).
#
# Fly requires at least one machine per process group. Since our
# single backend machine now has two groups, Fly will schedule TWO
# machines: one running `app`, one running `agent`. Both identical VM
# size. That's Fly's current multi-process model; there is no
# "sidecar in same container" primitive.
#
# Cost: second machine is the same shared-cpu-1x 512 MB ≈ $3/month.
# The Alloy process only needs ~30-40 MB RAM so the second VM is
# mostly idle; acceptable hobby cost for pushing real metrics to
# Grafana Cloud.
#
# If cost becomes a concern later, move the agent to its OWN Fly app
# (scaled to the smallest VM — shared-cpu-1x 256 MB) and point it at
# the public triaige-backend.fly.dev/metrics. Internal loopback is
# nicer latency but public scrape also works over Fly's free egress.

[processes]
  app = "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT} --proxy-headers --forwarded-allow-ips=*'"
  agent = "/usr/local/bin/alloy run /etc/alloy/config.river --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy"

# ─── Deploy release phase ─────────────────────────────────────────
#
# Release command runs ONCE per deploy, BEFORE any machine receives
# traffic. Kept empty intentionally — we have no DB migrations
# (Supabase is schema-externally-managed) and no one-time bootstraps.
# If migrations get added to backend/sql/ with a runner, wire that
# command here.
[deploy]
  strategy = "rolling"
